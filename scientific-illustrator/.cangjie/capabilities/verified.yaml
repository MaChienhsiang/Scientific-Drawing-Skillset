entry:
  name: scientific-illustrator
  description: |
    当用户要把论文、实验机制、技术路线、系统架构、空间过程或临床过程变成科研示意图，或要为 AI 绘图模型编写、改写、评审提示词时调用。先把科学主张和阅读顺序变成视觉规格，再给出构图、面板、语义配色、箭头、标注、负面约束、迭代质检和可编辑交付方案。不适用于纯装饰插画或要求 AI 臆造数据、实验结果、统计图数值的任务。
  core_principles:
  - 先定义科学主张和阅读顺序，再定义画面元素
  - 用面板、动线、留白和层级降低认知负担
  - 用颜色、箭头、字体和负面约束建立视觉语法
  - 通过事实核对、缩略图检查和迭代验收
  - 将栅格草稿转为可编辑的图形资产
  out_of_scope:
  - 纯装饰插画和没有科学关系的海报
  - 统计分析和真实数据计算
  - 由模型臆造实验数据、病例结果或工程参数
  stop_conditions:
  - 缺少主张、关键对象、关系或真实定量数据时先列出缺口
  - 医学、化学、材料、工程安全和地理尺度事实未核查时不宣称终稿
  - 只要求软件快捷键或 API 操作时转用对应工具技能
